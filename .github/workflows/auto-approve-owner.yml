name: Approve repository owner PRs

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write

concurrency:
  group: owner-pr-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve:
    if: github.event.pull_request.user.id == github.event.repository.owner.id && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve the owner's current commit
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.user.id !== context.payload.repository.owner.id || pr.state !== 'open' || pr.draft) {
              core.info('Skipping: this is not an open, ready PR from the repository owner.');
              return;
            }
            if (pr.head.sha !== context.payload.pull_request.head.sha) {
              core.info('Skipping: a newer commit has superseded this run.');
              return;
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number, per_page: 100
            });
            const previous = reviews.findLast(review => review.user?.login === 'github-actions[bot]');
            if (previous?.state === 'APPROVED' && previous.commit_id === pr.head.sha) {
              core.info('The current commit is already approved.');
              return;
            }
            await github.rest.pulls.createReview({
              owner, repo, pull_number,
              commit_id: pr.head.sha,
              event: 'APPROVE',
              body: 'Automatically approved because the PR author is the repository owner.'
            });
